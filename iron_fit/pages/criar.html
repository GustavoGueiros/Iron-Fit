<!-- Protótipo estático de cadastro; o processamento real está em criar.php. -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Academia</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/index.css">

  
</head>
<body>

    <body class="container-fluid vh-100">
        <div class="row h-100">
    
            <!-- Logo -->
            <div class="col-md-6 d-flex justify-content-center align-items-center logo">
                <div class="text-center">
                    <h1 class="display-1 fw-bold">Iron Fit</h1>
                    <p class="text-danger mt-3">SUPERE SEUS LIMITES</p>
                </div>
            </div>
    
            <!-- Login -->
            <div class="col-md-6 d-flex justify-content-center align-items-center">
                <div class="login" style="width:450px;">
    
                    <h2 class="text-danger mb-5">CRIAR CONTA</h2>
    
                    <form action="home.php" method="POST">
                        <label>Nome</label>
                        <input type="name" class="form-control mb-3" name="nome" required>
                        
                        <label>CPF</label>
                        <input type="text" name="cpf" id="cpf" class="form-control mb-3" placeholder="000.000.000-00" maxlength="14" required>

                        <label>Telefone</label>
                        <input type="tel" class="form-control mb-3" id="telefone" name="telefone" placeholder="(11) 99999-9999" maxlength="15"required>

                        <div class="invalid-feedback">
                            Digite um telefone válido.
                        </div>

                        <label>Email</label>
                        <input type="email" class="form-control mb-3" name="email" required>

                        <label>Senha</label>
                        <input type="password" class="form-control mb-3" name="senha" required>

                        <label>Confirmar Senha</label>
                        <input type="password" class="form-control mb-3" name="senha" required>


                        <a href="../index.html" class="text-danger text-decoration-none">
                            Já tenho uma conta.
                        </a>

                    <button class="btn btn-outline-danger btn-lg w-100">
                        Criar Conta
                    </button>
                    
                    </form>
    
                    <div class="text-end mb-4">
    
                </div>
            </div>
    
        </div>
    </div>

    <script>
document.getElementById("cpf").addEventListener("input", function (e) {

    let cpf = e.target.value.replace(/\D/g, "");

    cpf = cpf.replace(/(\d{3})(\d)/, "$1.$2");
    cpf = cpf.replace(/(\d{3})(\d)/, "$1.$2");
    cpf = cpf.replace(/(\d{3})(\d{1,2})$/, "$1-$2");

    e.target.value = cpf;
});
</script>
<script>
    const telefone = document.getElementById("telefone");

    telefone.addEventListener("input", function () {
        let valor = telefone.value.replace(/\D/g, "");

        if (valor.length > 11) {
            valor = valor.substring(0, 11);
        }

        if (valor.length <= 10) {
            valor = valor.replace(/^(\d{2})(\d)/, "($1) $2");
            valor = valor.replace(/(\d{4})(\d)/, "$1-$2");
        } else {
            valor = valor.replace(/^(\d{2})(\d)/, "($1) $2");
            valor = valor.replace(/(\d{5})(\d)/, "$1-$2");
        }

        telefone.value = valor;
    });
</script>

</body>
